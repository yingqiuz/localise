image: python:3.9

stages:
  - build
  - test
  - docs

pages:
  stage: docs
  script:
  - pip install sphinx
  - pip install sphinx_rtd_theme
  - cd docs
  - make html
  - mv build/html public
  artifacts:
    paths:
    - public
  tags:
    - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -V  # Print out python version for debugging
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install -r requirements.txt

build:
  stage: build
  script:
    - python setup.py install
  tags:
    - docker

test:
  stage: test
  script: 
    - python -m pytest
  tags:
    - docker
